<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matias Santelices">
    <title>Certificación - Simulacro</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <!-- HEADER / NAVBAR -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <img src="static/images/logo.png" alt="logo">
                <h1><span class="color-taco">Taco</span>Palace</h1>
            </div>
            <form class="search-box">
                <input type="email" placeholder="email">
                <button type="submit" class="btn-login">Login</button>
                <div class="carrito">
                    <img src="static/images/carrito.png" alt="carrito">
                    <span>0</span>
                </div>
            </form>
        </nav>
    </header>

    <main class="contenedor-principal">
        <section class="container">
            <div class="caja1">
                <div class="tarjeta">
                    <img class="imagen1" src="static/images/enchiladas.jpg" alt="Enchiladas">
                    <span>Enchiladas</span>
                </div>
                <div class="tarjeta">
                    <img class="imagen1" src="static/images/tacos.jpg" alt="Tacos">
                    <span>Tacos</span>
                </div>
                <div class="tarjeta">
                    <img class="imagen1" src="static/images/flautas.jpg" alt="Flautas">
                    <span>Flautas</span>
                </div>
                <div class="tarjeta">
                    <img class="imagen1" src="static/images/gorditas.jpg" alt="Gorditas">
                    <span>Gorditas</span>
                </div>
                <div class="tarjeta">
                    <img class="imagen1" src="static/images/tostadas.jpg" alt="Tostadas">
                    <span>Tostadas</span>
                </div>
                <div class="tarjeta">
                    <img class="imagen1" src="static/images/enfrijoladas.jpg" alt="Enfrijoladas">
                    <span>Enfrijoladas</span>
                </div>
            </div>
        </section>

        <section class="container-izquierdo">
            <div class="caja2">
                <div class="texto-banner">
                    <h1>La mejor<br>variedad en<br>platillos de<br>comida<br>mexicana</h1>
                    <p>Contamos con<br><a href="#" class="difer">servicio</a> a <span class="color-domicilio">domicilio</span></p>
                </div>
                <div class="img-banner-wrapper">
                    <img class="imagen2" src="static/images/comida-mexicana.jpg" alt="Comida mexicana">
                </div>
            </div>

            <div class="container-derecho">
                <h2 class="h2">Recomendados:</h2>

                <div class="item-recomendado">
                    <img class="imagen3" src="static/images/orden-tacos.jpg" alt="Orden de tacos">
                    <p class="titulo-item">Orden de Tacos</p>
                    <div class="mas">
                        <a class="difer" href="#">Ver Más...</a>
                        <button type="button" class="btn-click">+</button>
                    </div>
                </div>
                <div class="item-recomendado">
                    <img class="imagen3" src="static/images/orden-flautas.jpg" alt="Orden de flautas">
                    <p class="titulo-item">Orden de Flautas</p>
                    <div class="mas">
                        <a class="difer" href="#">Ver Más...</a>
                        <button type="button" class="btn-click">+</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
